# subplane agent configuration.
#
# Vocabulary: a *component* is compiled into the binary (transport, framing,
# decoder). An *activation* (each partition of a topic under `topics`) selects
# components and parameterizes them. A *session* is an app subscription with
# its own filter and shared-memory ring; the `sessions` section is reloadable
# at runtime, everything else requires a restart.
#
# Topics hold partitions numbered from 1; each partition is one stream with one
# publisher and one sequence. Apps subscribe to topics and never see partitions
# (architecture.md, "Topics and partitions").

agent:
  name: subplane
  version: 2.0.0-dev
  max_symbols: 65536
  thread_groups:
    - name: g0
      cpu: -1            # pin to this core; -1 = unpinned
      topics: [eq.sample]  # a topic's partitions always share one group

# topic_name -> topic_id: the site's registry file (or the entries inline).
registry: site/topics.example.yaml

# One entry per topic this box subscribes to. Keys at the topic level are shared
# by its partitions; each `partitions:` entry overrides them for one partition
# (maps merge, anything else replaces). No `partitions:` means one partition.
topics:
  - name: eq.sample
    transport:
      type: udp_multicast
      group: 239.1.1.1   # empty string = plain UDP unicast (CI)
      port: 30001
      interface: ""      # bind interface address; empty = INADDR_ANY
      rcvbuf: 16777216
      busy_poll_us: 50
      mtu: 1500
      batch: 32
    framing:
      # Declarative packet layout. Only the SBE schema is a hard requirement;
      # message length defaults to the schema walk when no prefix is present.
      packet_header:
        - { name: seq,   type: u64le }
        - { name: count, type: u16le }
      message_prefix:
        - { name: len,   type: u16le }
      sequence: packet_header.seq      # packet_header.<f> | message.<SchemaField> | none
      length:   message_prefix.len     # message_prefix.<f> | schema
    decoder:
      type: sbe_routing
      schema: schemas/sample_md.xml
      fields:
        symbol:      SecurityID
        sequence:    SeqNum
        exchange_ts: TransactTime
        venue:       MarketSegmentID
      symbol_id_mode: table            # table | passthrough
      messages:
        - { template: 1,   msg_type: TRADE }
        - { template: 2,   msg_type: QUOTE }
        - { template: 3,   msg_type: BOOK_UPDATE }
        - { template: 100, admin: HEARTBEAT }
        - { template: 101, admin: SEQ_RESET }
    heartbeat_timeout_ms: 2000
    dup_window: 1024       # backward seq jumps larger than this are treated as a publisher restart
    # partitions:          # a second stream of the same topic: its own group, everything else shared
    #   - {}
    #   - transport: { group: 239.1.1.2 }

  # A second topic carrying a different encoding over a different transport.
  # Encoding is per-topic configuration; the ring contract is the same.
  # Try it: build/tools/subplane dbn-sim --port 9550 --synthetic   (or --file x.dbn)
  # - name: dbn.sample
  #   transport:
  #     type: tcp_stream
  #     host: 127.0.0.1
  #     port: 9550
  #     record_length: { offset: 0, size: 1, scale: 4 }   # DBN: u8 length in 4-byte words
  #     prelude: dbn                                       # "DBN" + version + metadata, skipped per connection
  #     reconnect_ms: 1000
  #   framing: { length: packet }      # one record per packet (default for dbn)
  #   decoder:
  #     type: dbn
  #     symbol_id_mode: passthrough    # instrument_id is the symbol id
  #     # messages: omitted = defaults (MBO->BOOK_UPDATE, trade->TRADE, MBP-1->QUOTE, ..., SYSTEM->HEARTBEAT)
  #   heartbeat_timeout_ms: 5000

  # A FlatBuffers bus: routing fields named by field id, no schema file, no library.
  # Try it: build/tools/subplane replay --pcap tests/fixtures/flatbuffers/fb_sample.pcap --port 30002
  # - name: fb.sample
  #   transport: { type: udp, group: "", port: 30002 }
  #   framing:                         # several size-prefixed buffers per datagram; omit for one per datagram
  #     message_prefix: [ { name: size, type: u32le } ]
  #     length: message_prefix.size
  #     keep_prefix: true              # the ring payload is the whole buffer, prefix included
  #   decoder:
  #     type: flatbuffers
  #     size_prefixed: true
  #     symbol_id_mode: passthrough
  #     dispatch: { type_field: { path: [2], type: u8 } }   # Envelope.body_type (union type)
  #     messages:
  #       - { type: 1, msg_type: TRADE, symbol: { path: [3, 0, 0], type: u32 }, venue: { path: [3, 0, 1], type: u16 },
  #           exchange_ts: { path: [1], type: u64 }, sequence: { path: [0], type: u64 } }
  #       - { type: 2, msg_type: QUOTE, symbol: { path: [3, 0, 0], type: u32 }, venue: { path: [3, 0, 1], type: u16 },
  #           exchange_ts: { path: [1], type: u64 }, sequence: { path: [0], type: u64 } }
  #       - { type: 3, admin: HEARTBEAT, sequence: { path: [0], type: u64 } }
  #   heartbeat_timeout_ms: 5000

  # The canonical flat schema (schemas/subplane_canonical.xml): what gateways in the feeds package
  # publish and what the normalization mode (planned) emits. Plain sbe_routing configuration.
  # Try it: build/examples/canonical_pub --port 30003   (or subplane send --schema schemas/subplane_canonical.xml ...)
  #         build/examples/views_app /dev/shm/subplane.subplane.<session>.ring
  # - name: canonical.sample
  #   transport: { type: udp, group: "", port: 30003 }
  #   framing:
  #     packet_header: [ { name: seq, type: u64le }, { name: count, type: u16le } ]
  #     message_prefix: [ { name: len, type: u16le } ]
  #     sequence: packet_header.seq
  #     length: message_prefix.len
  #   decoder:
  #     type: sbe_routing
  #     schema: schemas/subplane_canonical.xml
  #     fields: { symbol: InstrumentId, sequence: Sequence, instrument_sequence: InstrumentSeq, exchange_ts: ExchangeTs, venue: VenueId }
  #     symbol_id_mode: table
  #     messages:
  #       - { template: 1,   msg_type: TRADE }
  #       - { template: 2,   msg_type: QUOTE }
  #       - { template: 3,   msg_type: BOOK_UPDATE }
  #       - { template: 4,   msg_type: BOOK_SNAPSHOT }
  #       - { template: 5,   msg_type: OHLCV }
  #       - { template: 6,   msg_type: STATUS }
  #       - { template: 10,  msg_type: DEFINITION }  # InstrumentDefinition
  #       - { template: 100, admin: HEARTBEAT }
  #   heartbeat_timeout_ms: 5000

  # The canonical stream over Aeron: what a subplane-feeds gateway publishes (e.g. `spwsgw --pack packs/binance-spot.yaml`).
  # An offer holds one or more whole canonical messages back to back; the schema walk splits them and Sequence comes from each.
  # The Aeron stream id is the partition's stream_id: crypto.binance-spot is topic 11, so partition 1 is 11 << 16 | 1 = 720897.
  # Try it: build/tools/subplane aeron-pub --channel aeron:ipc --stream-id 720897 --count 1000   (attaches to the agent's embedded driver)
  #         or a real feed: spwsgw --pack packs/binance-spot.yaml --symbols BTCUSDT --channel aeron:ipc --topic crypto.binance-spot --topic-registry <this file's registry> --aeron-dir <this agent's aeron_dir>
  # - name: crypto.binance-spot
  #   transport:
  #     type: aeron
  #     channel: "aeron:ipc"            # or aeron:udp?endpoint=0.0.0.0:40456 | aeron:udp?endpoint=239.1.1.1:40456|interface=10.0.0.1
  #     # stream_id: 720897             # the default (topic_id << 16 | partition_num); set it only for a stream that has another id
  #     aeron_dir: ""                   # empty = Aeron default; must match the publisher's driver for aeron:ipc
  #     driver: { embedded: true, threading_mode: shared }   # omit to use an external aeronmd
  #   framing: { length: schema, sequence: message.Sequence }   # a gateway offer holds one or more canonical messages back to back
  #   decoder:
  #     type: sbe_routing
  #     schema: schemas/subplane_canonical.xml
  #     fields: { symbol: InstrumentId, sequence: Sequence, instrument_sequence: InstrumentSeq, exchange_ts: ExchangeTs, venue: VenueId, stream_id: StreamId }
  #     symbol_id_mode: table
  #     messages:                     # every canonical template: an unlisted one is dropped before its Sequence is read, so it shows as a gap
  #       - { template: 1,   msg_type: TRADE }
  #       - { template: 2,   msg_type: QUOTE }
  #       - { template: 3,   msg_type: BOOK_UPDATE }
  #       - { template: 4,   msg_type: BOOK_SNAPSHOT }
  #       - { template: 5,   msg_type: OHLCV }
  #       - { template: 6,   msg_type: STATUS }
  #       - { template: 10,  msg_type: DEFINITION }  # InstrumentDefinition
  #       - { template: 100, admin: HEARTBEAT }
  #   heartbeat_timeout_ms: 5000

# Operator-defined sessions. Apps may also create their own over the control channel.
sessions:
  - name: alpha
    ring:
      capacity_mb: 64
      max_payload: 4096
    topics: [eq.sample]  # patterns: `*` one segment, a final `>` the rest; omit for all topics
    symbols: ["*"]
    msg_types: [TRADE, QUOTE]
    deliver:
      bus_admin: true
      agent_control: true

fanout:
  ring_dir: /dev/shm

control:
  socket_path: /run/subplane/subplane.sock
  fallback_socket_path: /tmp/subplane.sock
  linger_ms: 5000

lvc:
  max_payload: 512

api:
  enabled: true
  host: 127.0.0.1
  port: 8080

metrics:
  enabled: true
  report_interval_seconds: 60
  output_format: json
  console_output: false

logging:
  level: info
  console_output: true
  output_format: text
